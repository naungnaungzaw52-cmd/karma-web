<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <!-- 🌟 flutter_webrtc အတွက် Web JavaScript Helper & Adapter -->
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- 🌟 SEO Meta Tags & Earn System Description -->
  <meta name="description" content="Karma Myanmar is a local social networking, media sharing, and messaging platform where users can connect, chat, and earn rewards through our exciting earn system.">
  <meta name="keywords" content="Karma Myanmar, Karma App, Myanmar social media, earn money online, chat app, rewards system">

  <!-- 🌟 Open Graph / Social Media Sharing Tags (Facebook, Telegram, Viber etc.) -->
  <meta property="og:title" content="Karma Myanmar - Connect, Chat & Earn">
  <meta property="og:description" content="Join Karma Myanmar today! Connect with friends, share media, and participate in our user earn rewards system.">
  <meta property="og:url" content="https://www.karmamyanmar.com/">
  <meta property="og:type" content="website">
  <!-- 🌟 Google Search နဲ့ Social Media တွေမှာ ပုံပေါ်လာစေရန် Logo ပုံ URL ထည့်သွင်းခြင်း (ဥပမာ- 512x512 PNG ပုံ) -->
  <meta property="og:image" content="https://www.karmamyanmar.com/icons/Icon-512.png">

  <!-- 🌟 Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Karma Myanmar - Connect, Chat & Earn">
  <meta name="twitter:description" content="Join Karma Myanmar today! Connect with friends, share media, and participate in our user earn rewards system.">
  <meta name="twitter:image" content="https://www.karmamyanmar.com/icons/Icon-512.png">

  <!-- 🌟 Google Sign-In Web Client ID ထည့်သွင်းခြင်း -->
  <meta name="google-signin-client_id" content="386912084170-i8gscrc8jrbm4iq92te39aj98i7ngfu4.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Karma Myanmar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <title>Karma Myanmar - Social Network & Earn System</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2123062531";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
